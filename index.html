<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <title>康高e网 · 双模刷课</title>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        :root {
            --bg-start: #dbeafe;
            --bg-end: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.5);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #1d4ed8;
            --accent-light: #3b82f6;
            --input-bg: rgba(255, 255, 255, 0.65);
            --shadow-color: rgba(30, 64, 175, 0.18);
            --progress-bg: rgba(30, 64, 175, 0.12);
            --progress-fill: linear-gradient(90deg, #1d4ed8, #60a5fa);
            --btn-primary-bg: linear-gradient(135deg, #1e40af, #3b82f6);
            --btn-primary-shadow: rgba(59, 130, 246, 0.35);
            --announcement-bg: rgba(255, 255, 255, 0.8);
            --modal-bg: rgba(255, 255, 255, 0.96);
            --border-glow: rgba(59, 130, 246, 0.25);
            --total-bar-h: 14px;
            --other-bar-h: 8px;
            --dot-online: #34d399;
            --dot-offline: #ef4444;
            --dot-busy: #eab308;
            --log-bg: rgba(30, 64, 175, 0.06);
            --toast-bg: rgba(255, 255, 255, 0.95);
            --tab-inactive: rgba(255, 255, 255, 0.45);
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace
        }
        [data-theme="dark"] {
            --bg-start: #0a0a0f;
            --bg-end: #1a1a1a;
            --card-bg: rgba(26, 26, 28, 0.82);
            --card-border: rgba(255, 215, 0, 0.2);
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --accent: #eab308;
            --accent-light: #facc15;
            --input-bg: rgba(50, 50, 50, 0.7);
            --shadow-color: rgba(0, 0, 0, 0.45);
            --progress-bg: rgba(234, 179, 8, 0.12);
            --progress-fill: linear-gradient(90deg, #ca8a04, #facc15);
            --btn-primary-bg: linear-gradient(135deg, #ca8a04, #facc15);
            --btn-primary-shadow: rgba(234, 179, 8, 0.35);
            --announcement-bg: rgba(28, 28, 30, 0.9);
            --modal-bg: rgba(20, 20, 22, 0.97);
            --border-glow: rgba(234, 179, 8, 0.25);
            --dot-online: #7ecf9e;
            --dot-offline: #cf7e7e;
            --dot-busy: #d4b28c;
            --log-bg: rgba(0, 0, 0, 0.25);
            --toast-bg: rgba(30, 30, 34, 0.95);
            --tab-inactive: rgba(255, 255, 255, 0.08)
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            transition: background 0.5s ease;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative
        }
        #fluid-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 540px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }
        .title {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
            position: relative;
            filter: drop-shadow(0 4px 12px var(--shadow-color))
        }
        .title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 10px auto 0;
            border-radius: 2px
        }
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.5s ease;
            box-shadow: 0 0 8px transparent
        }
        .status-dot.online {
            background: var(--dot-online);
            box-shadow: 0 0 16px var(--dot-online)
        }
        .status-dot.offline {
            background: var(--dot-offline);
            box-shadow: 0 0 16px var(--dot-offline)
        }
        .status-dot.busy {
            background: var(--dot-busy);
            box-shadow: 0 0 20px var(--dot-busy);
            animation: pulse-dot 1.4s ease-in-out infinite
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }
            50% {
                transform: scale(1.35);
                opacity: 0.65
            }
        }
        .announcement-bar {
            background: var(--announcement-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px var(--shadow-color);
            transition: all 0.4s cubic-bezier(0.65, 0, 0.35, 1);
            position: relative;
            overflow: hidden
        }
        .announcement-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
            transition: left 0.6s ease
        }
        .announcement-bar:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 36px var(--shadow-color)
        }
        .announcement-bar:hover::before {
            left: 100%
        }
        .announcement-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
            animation: pulse 2s infinite
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }
            50% {
                transform: scale(1.12);
                opacity: 0.85
            }
        }
        .announcement-text {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px
        }
        .announcement-more {
            font-size: 0.78rem;
            color: var(--accent);
            flex-shrink: 0;
            font-weight: 700;
            letter-spacing: 1px
        }
        .announcement-refresh {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
            line-height: 1
        }
        .announcement-refresh:hover {
            background: var(--progress-bg);
            color: var(--text-primary);
            transform: rotate(45deg)
        }
        .login-card,
        .progress-card,
        .log-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 30px;
            box-shadow: 0 8px 48px var(--shadow-color);
            margin-bottom: 24px;
            transition: background 0.4s ease, box-shadow 0.4s ease
        }
        .input-group {
            margin-bottom: 16px
        }
        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 1px
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-glow);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.35s ease;
            backdrop-filter: blur(4px)
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--shadow-color);
            transform: translateY(-1px)
        }
        .input-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6
        }
        .subject-select {
            margin-bottom: 20px
        }
        .subject-select label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 1px
        }
        .subject-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }
        .subject-option {
            flex: 1;
            min-width: 80px;
            text-align: center;
            padding: 10px 8px;
            border: 1.5px solid var(--border-glow);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            position: relative;
            overflow: hidden
        }
        .subject-option:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow-color)
        }
        .subject-option.active {
            background: var(--btn-primary-bg);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 20px var(--btn-primary-shadow);
            font-weight: 700;
            transform: translateY(-2px)
        }
        .subject-option .sub-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.75;
            margin-top: 2px
        }
        .login-btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: var(--btn-primary-bg);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 4px 18px var(--btn-primary-shadow);
            letter-spacing: 6px;
            position: relative;
            overflow: hidden
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px var(--btn-primary-shadow)
        }
        .login-btn:hover::after {
            left: 100%
        }
        .login-btn:active {
            transform: translateY(0)
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px
        }
        .actions .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }
        .actions .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s ease
        }
        .actions .btn:hover::after {
            left: 100%
        }
        .actions .btn-primary {
            background: var(--btn-primary-bg);
            color: #fff;
            box-shadow: 0 4px 18px var(--btn-primary-shadow)
        }
        .actions .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px var(--btn-primary-shadow)
        }
        .actions .btn-primary:active {
            transform: translateY(0) scale(0.98)
        }
        .actions .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none
        }
        .actions .btn-secondary {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1.5px solid var(--border-glow);
            backdrop-filter: blur(4px)
        }
        .actions .btn-secondary:hover {
            border-color: var(--accent);
            background: var(--card-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow-color)
        }
        .actions .btn-secondary:active {
            transform: translateY(0)
        }
        .actions .btn-secondary:disabled {
            opacity: 0.25;
            cursor: not-allowed
        }
        .actions .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1.5px solid rgba(239, 68, 68, 0.15)
        }
        [data-theme="dark"] .actions .btn-danger {
            background: rgba(207, 126, 126, 0.12);
            color: #cf7e7e;
            border-color: rgba(207, 126, 126, 0.15)
        }
        .actions .btn-danger:hover {
            background: var(--card-bg)
        }
        .actions .btn-danger:disabled {
            opacity: 0.25;
            cursor: not-allowed
        }
        .tab-nav {
            display: flex;
            gap: 4px;
            background: var(--tab-inactive);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(8px);
            margin-bottom: 24px
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.5px
        }
        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--card-bg)
        }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
            box-shadow: 0 4px 20px var(--shadow-color)
        }
        .tab-panel {
            display: none;
            animation: fadeSlide 0.35s ease
        }
        .tab-panel.active {
            display: block
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .progress-item {
            margin-bottom: 18px
        }
        .progress-item:last-of-type {
            margin-bottom: 0
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px
        }
        .progress-label {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px
        }
        .progress-label .icon {
            font-size: 1rem
        }
        .progress-percent {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--progress-bg);
            padding: 2px 8px;
            border-radius: 8px
        }
        .progress-bar {
            height: var(--other-bar-h);
            background: var(--progress-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative
        }
        .total-progress .progress-bar {
            height: var(--total-bar-h);
            border: 1px solid var(--border-glow);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05)
        }
        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            position: relative
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: shimmer 2.2s infinite
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%)
            }
            100% {
                transform: translateX(100%)
            }
        }
        .progress-fill.done {
            background: linear-gradient(90deg, #34d399, #6ee7b7)
        }
        [data-theme="dark"] .progress-fill.done {
            background: linear-gradient(90deg, #7ecf9e, #a8e6b8)
        }
        .phase-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-glow)
        }
        .phase-item {
            display: flex;
            align-items: center;
            gap: 10px
        }
        .phase-item .name {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
            width: 56px;
            flex-shrink: 0
        }
        .phase-item .track {
            flex: 1;
            height: 4px;
            background: var(--progress-bg);
            border-radius: 20px;
            overflow: hidden;
            min-width: 30px
        }
        .phase-item .track .fill {
            height: 100%;
            border-radius: 20px;
            background: var(--progress-fill);
            width: 0%;
            transition: width 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)
        }
        .phase-item .track .fill.done {
            background: linear-gradient(90deg, #34d399, #6ee7b7)
        }
        [data-theme="dark"] .phase-item .track .fill.done {
            background: linear-gradient(90deg, #7ecf9e, #a8e6b8)
        }
        .phase-item .track .fill.active {
            animation: phase-pulse 1.6s ease-in-out infinite
        }
        @keyframes phase-pulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: 0.5
            }
        }
        .phase-item .status-icon {
            font-size: 12px;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            color: var(--text-secondary);
            transition: color 0.4s ease
        }
        .phase-item .status-icon.done {
            color: var(--dot-online)
        }
        .phase-item .status-icon.active {
            color: var(--accent)
        }
        .phase-item .status-icon.error {
            color: var(--dot-offline)
        }
        .task-info {
            display: flex;
            justify-content: space-around;
            padding-top: 18px;
            margin-top: 18px;
            border-top: 1px dashed var(--border-glow);
            flex-wrap: wrap;
            gap: 8px
        }
        .task-count {
            text-align: center;
            padding: 8px 16px;
            border-radius: 14px;
            background: var(--progress-bg);
            transition: transform 0.3s ease
        }
        .task-count:hover {
            transform: scale(1.05)
        }
        .task-count .number {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.4
        }
        .task-count .label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 2px
        }
        .log-card {
            padding: 20px 24px
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px
        }
        .log-title {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.8px
        }
        .log-count {
            font-size: 0.72rem;
            color: var(--text-secondary);
            opacity: 0.7
        }
        .log-area {
            background: var(--log-bg);
            border-radius: 14px;
            padding: 14px 16px;
            min-height: 100px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid var(--border-glow);
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.8;
            color: var(--text-secondary);
            scroll-behavior: smooth
        }
        .log-area::-webkit-scrollbar {
            width: 4px
        }
        .log-area::-webkit-scrollbar-track {
            background: transparent
        }
        .log-area::-webkit-scrollbar-thumb {
            background: var(--border-glow);
            border-radius: 10px
        }
        .log-entry {
            opacity: 0.95;
            transition: opacity 0.2s;
            padding: 1px 0
        }
        .log-entry .time {
            color: var(--text-secondary);
            margin-right: 10px;
            font-size: 10px;
            opacity: 0.6
        }
        .log-entry .msg.success {
            color: var(--dot-online)
        }
        .log-entry .msg.error {
            color: var(--dot-offline)
        }
        .log-entry .msg.warn {
            color: var(--accent)
        }
        .log-entry .msg.info {
            color: var(--accent)
        }
        .log-empty {
            color: var(--text-secondary);
            text-align: center;
            padding: 26px 0;
            font-size: 13px;
            font-family: inherit;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0.6
        }
        .scan-progress {
            margin-top: 14px;
            padding: 12px 16px;
            background: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            display: none
        }
        .scan-progress.active {
            display: block;
            animation: fadeSlide 0.4s ease
        }
        .scan-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            font-weight: 500
        }
        .scan-label .pct {
            color: var(--accent);
            font-weight: 700
        }
        .scan-track {
            width: 100%;
            height: 4px;
            background: var(--progress-bg);
            border-radius: 20px;
            margin-top: 6px;
            overflow: hidden
        }
        .scan-fill {
            height: 100%;
            border-radius: 20px;
            background: var(--progress-fill);
            width: 0%;
            transition: width 0.5s ease

</head>
<body>
    <!-- ===== 卡密验证系统（新） ===== -->
    <script>
        // ============================================================
        // 配置
        // ============================================================
        var CONFIG = {
            API_URL: 'https://www.keyt.cn/kami/lxl100328/check.php',
            APP_NAME: 'ewt'
        };

        var CACHE_TIME = 86400; // 1天（秒）

        // ============================================================
        // 兼容性存储层（localStorage → cookie）
        // ============================================================
        var Storage = {
            set: function(key, value) {
                try {
                    localStorage.setItem(key, value);
                    return;
                } catch (e) {}
                try {
                    document.cookie = key + '=' + encodeURIComponent(value) + '; path=/; max-age=' + CACHE_TIME;
                } catch (e2) {}
            },
            get: function(key) {
                try {
                    var val = localStorage.getItem(key);
                    if (val !== null) return val;
                } catch (e) {}
                try {
                    var match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
                    if (match) return decodeURIComponent(match[2]);
                } catch (e2) {}
                return null;
            },
            remove: function(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {}
                try {
                    document.cookie = key + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                } catch (e2) {}
            }
        };

        // ============================================================
        // 获取稳定设备指纹
        // ============================================================
        function getDeviceId() {
            var saved = Storage.get('device_id');
            if (saved) return saved;

            var parts = [];

            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        var gpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL) || '';
                        if (gpu) parts.push('gpu:' + gpu);
                    }
                }
            } catch (e) {}

            if (parts.length === 0) {
                try {
                    var c = document.createElement('canvas');
                    c.width = 256;
                    c.height = 64;
                    var ctx = c.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = '#f60';
                        ctx.fillRect(100, 1, 62, 20);
                        ctx.fillStyle = '#069';
                        ctx.font = '14px Arial';
                        ctx.fillText('Keyt.cn', 2, 15);
                        ctx.fillStyle = 'rgba(100,200,50,0.5)';
                        ctx.beginPath();
                        ctx.arc(50, 30, 15, 0, Math.PI * 2);
                        ctx.fill();
                        parts.push('canvas:' + CryptoJS.MD5(c.toDataURL()).toString());
                    }
                } catch (e) {}
            }

            if (parts.length === 0) {
                parts.push('screen:' + (screen.width || 0) + 'x' + (screen.height || 0) + 'x' + (screen.colorDepth || 24));

                var os = navigator.platform || '';
                if (os.indexOf('Win') !== -1) os = 'Windows';
                else if (os.indexOf('Mac') !== -1) os = 'Mac';
                else if (os.indexOf('Linux') !== -1) os = 'Linux';
                else if (os.indexOf('iPhone') !== -1 || os.indexOf('iPad') !== -1) os = 'iOS';
                else if (os.indexOf('Android') !== -1) os = 'Android';
                else os = 'Other';
                parts.push('os:' + os);

                parts.push('lang:' + (navigator.language || navigator.userLanguage || 'zh-CN'));
            }

            var raw = parts.join('|');
            var deviceId = 'web_' + CryptoJS.MD5(raw).toString();
            Storage.set('device_id', deviceId);
            return deviceId;
        }

        // ============================================================
        // 工具函数
        // ============================================================
        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return decodeURIComponent(match[2]);
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        }

        function request(url, callback) {
            var xhr = null;
            var done = false;

            function doneOnce(res) {
                if (!done) {
                    done = true;
                    callback(res);
                }
            }

            try {
                xhr = new XMLHttpRequest();
            } catch (e) {
                try {
                    xhr = new ActiveXObject('Microsoft.XMLHTTP');
                } catch (e2) {}
            }

            if (!xhr) {
                doneOnce('error|no_xhr');
                return;
            }

            xhr.open('GET', url, true);
            xhr.timeout = 15000;

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    doneOnce(xhr.status === 200 ? xhr.responseText : 'error|network_error');
                }
            };
            xhr.ontimeout = function() {
                doneOnce('error|network_error');
            };
            xhr.onerror = function() {
                doneOnce('error|network_error');
            };

            xhr.send();
        }

        var ERROR_MESSAGES = {
            'missing_params': '参数不完整',
            'app_not_found': '应用不存在',
            'invalid_card': '卡密无效，请检查是否输入正确',
            'expired': '卡密已过期',
            'banned': '卡密已被禁用',
            'device_mismatch': '设备不匹配',
            'online_limit_reached': '在线设备数已满',
            'too_frequent': '请求过于频繁，请稍后再试',
            'network_error': '网络异常，请稍后重试',
            'no_xhr': '当前浏览器不支持请求'
        };

        // ============================================================
        // 验证成功统一处理
        // ============================================================
        function handleVerifySuccess(card, days, minutes) {
            var now = Date.now();
            var isPermanent = (days === '永久');
            var cacheMaxAge = isPermanent ? 31536000 : CACHE_TIME;

            document.cookie = 'card_verified=true; path=/; max-age=' + cacheMaxAge;
            document.cookie = 'card=' + encodeURIComponent(card) + '; path=/; max-age=' + cacheMaxAge;
            document.cookie = 'remain_days=' + encodeURIComponent(days) + '; path=/; max-age=' + cacheMaxAge;
            document.cookie = 'remain_minutes=' + (minutes || 0) + '; path=/; max-age=' + cacheMaxAge;
            document.cookie = 'verify_time=' + now + '; path=/; max-age=' + cacheMaxAge;

            Storage.set('card_verified', 'true');
            Storage.set('card', card);
            Storage.set('remain_days', days);
            Storage.set('remain_minutes', String(minutes || 0));
            Storage.set('verify_time', now.toString());

            if (isPermanent) {
                Storage.remove('card_expire');
                deleteCookie('card_expire');
            } else {
                var exp = now + CACHE_TIME * 1000;
                Storage.set('card_expire', String(exp));
                document.cookie = 'card_expire=' + exp + '; path=/; max-age=' + CACHE_TIME;
            }

            var authBox = document.getElementById('authBox');
            if (authBox) authBox.style.display = 'none';

            location.reload();
        }

        // ============================================================
        // 验证状态
        // ============================================================
        function isVerified() {
            var verified = Storage.get('card_verified');
            var expire = Storage.get('card_expire');
            var days = Storage.get('remain_days');
            var minutes = parseInt(Storage.get('remain_minutes')) || 0;
            var verifyTime = parseInt(Storage.get('verify_time')) || 0;

            if (verified !== 'true') return false;

            // 永久卡不受本地 1 天缓存影响
            if (days === '永久') {
                return true;
            }

            if (expire && parseInt(expire) < Date.now()) return false;
            if (minutes <= 0) return false;

            if (verifyTime > 0 && (Date.now() - verifyTime) > CACHE_TIME * 1000) {
                Storage.remove('card_verified');
                Storage.remove('remain_days');
                Storage.remove('remain_minutes');
                Storage.remove('verify_time');
                Storage.remove('card_expire');
                return false;
            }

            return true;
        }

        // ============================================================
        // 主逻辑
        // ============================================================
        if (isVerified()) {
            // ===== 已登录，正常显示页面 =====
            var remainDiv = document.createElement('div');
            remainDiv.id = 'remainTimeDisplay';
            remainDiv.style.cssText =
                'position:fixed;top:16px;right:20px;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);color:#36d399;padding:8px 18px;border-radius:10px;font-size:14px;z-index:9999;font-family:sans-serif;border:1px solid rgba(255,255,255,0.08);box-shadow:0 4px 16px rgba(0,0,0,0.3);cursor:move;user-select:none;';
            remainDiv.textContent = '⏱ 加载中...';
            document.body.appendChild(remainDiv);

            // ===== 拖拽 =====
            var isDragging = false;
            var offsetX, offsetY;

            remainDiv.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'A') return;
                isDragging = true;
                var rect = remainDiv.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                remainDiv.style.cursor = 'grabbing';
                remainDiv.style.transition = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var x = e.clientX - offsetX;
                var y = e.clientY - offsetY;
                x = Math.max(0, Math.min(window.innerWidth - remainDiv.offsetWidth, x));
                y = Math.max(0, Math.min(window.innerHeight - remainDiv.offsetHeight, y));
                remainDiv.style.left = x + 'px';
                remainDiv.style.top = y + 'px';
                remainDiv.style.right = 'auto';
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    remainDiv.style.cursor = 'move';
                }
            });

            // ===== 剩余时间显示（每分钟更新） =====
            function updateRemainDisplay() {
                var days = Storage.get('remain_days') || '未知';
                var minutes = parseInt(Storage.get('remain_minutes')) || 0;
                var verifyTime = parseInt(Storage.get('verify_time')) || 0;

                if (days === '永久') {
                    remainDiv.textContent = '⏱ 永久有效';
                    remainDiv.style.color = '#36d399';
                    return;
                }

                if (minutes <= 0) {
                    remainDiv.textContent = '⏱ 卡密已过期';
                    remainDiv.style.color = '#ff6b6b';
                    return;
                }

                var remain = minutes;
                if (verifyTime > 0) {
                    var elapsedMinutes = Math.floor((Date.now() - verifyTime) / 60000);
                    remain = Math.max(0, minutes - elapsedMinutes);
                }

                if (remain <= 0) {
                    remainDiv.textContent = '⏱ 卡密已过期';
                    remainDiv.style.color = '#ff6b6b';
                    return;
                }

                var d = Math.floor(remain / 1440);
                var h = Math.floor((remain % 1440) / 60);
                var m = remain % 60;
                var text = '';
                if (d > 0) text += d + '天';
                if (h > 0) text += h + '小时';
                if (m > 0 || text === '') text += m + '分钟';

                remainDiv.textContent = '⏱ 剩余时间：' + text;
                remainDiv.style.color = '#36d399';
            }

            updateRemainDisplay();
            setInterval(updateRemainDisplay, 60000);

            // ===== 心跳保活：静默上报在线状态 =====
            var heartbeatStarted = false;

            function doHeartbeat() {
                var now = Date.now();
                var LOCK_DURATION = 55000;

                var lastCheck = Storage.get('keyt_last_heartbeat');
                if (lastCheck && (now - parseInt(lastCheck)) < LOCK_DURATION) return;

                var lockKey = 'keyt_heartbeat_lock';
                var lockTime = Storage.get(lockKey);
                if (lockTime && (now - parseInt(lockTime)) < 5000) return;
                Storage.set(lockKey, now.toString());

                var lastCheck2 = Storage.get('keyt_last_heartbeat');
                if (lastCheck2 && (now - parseInt(lastCheck2)) < LOCK_DURATION) {
                    Storage.remove(lockKey);
                    return;
                }

                Storage.set('keyt_last_heartbeat', now.toString());
                Storage.remove(lockKey);

                fetch('/keyt.cn.php?heartbeat=1&t=' + now, {
                    credentials: 'same-origin',
                    keepalive: true
                }).then(function(resp) {
                    return resp.text();
                }).then(function(data) {
                    var text = (data || '').trim();

                    // 服务端明确判定卡密失效：只更新状态，不强制关页面
                    if (text === 'EXPIRED') {
                        Storage.remove('card_verified');
                        Storage.remove('remain_days');
                        Storage.remove('remain_minutes');
                        Storage.remove('verify_time');
                        Storage.remove('card_expire');
                        Storage.remove('card');
                        deleteCookie('card');

                        var el = document.getElementById('remainTimeDisplay');
                        if (el) {
                            el.textContent = '⏱ 卡密已失效';
                            el.style.color = '#ff6b6b';
                        }
                    }
                    // 其他情况（OK等）静默，说明服务端已收到在线状态
                }).catch(function() {
                    // 网络波动：不提示、不跳转、不累计错误，等下一次心跳
                });
            }

            setTimeout(function() {
                heartbeatStarted = true;
                doHeartbeat();
                setInterval(doHeartbeat, 60000);
            }, 60000);

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && heartbeatStarted) {
                    doHeartbeat();
                }
            });

        } else {
            // ===== 未验证，弹出验证框 =====
            document.write(
                '<div id="authBox" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:999999;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">'
                );
            document.write(
                '<div style="background:#1a202c;padding:40px;border-radius:20px;width:400px;max-width:90%;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.06);">'
                );
            document.write('<div style="font-size:56px;margin-bottom:12px;">🔐</div>');
            document.write(
                '<h2 style="font-size:24px;margin-bottom:4px;font-weight:700;">请输入<a href="https://www.keyt.cn" target="_blank" style="color:#fff;text-decoration:none;">卡密通</a>过验证</h2>'
                );
            document.write(
                '<p style="color:#94a3b8;font-size:14px;margin-bottom:24px;">验证通过后才能查看内容</p>');
            document.write(
                '<div id="remainTime" style="color:#36d399;font-size:14px;margin-bottom:12px;"></div>');
            document.write(
                '<input id="cardInput" type="text" placeholder="请输入卡密" style="width:100%;padding:14px 18px;border:2px solid #2d3748;border-radius:12px;background:#111827;color:#fff;font-size:16px;text-align:center;letter-spacing:2px;outline:none;font-family:monospace;box-sizing:border-box;">'
                );
            document.write(
                '<div id="authError" style="color:#ff6b6b;font-size:13px;margin-top:8px;min-height:20px;"></div>'
                );
            document.write(
                '<button id="verifyBtn" style="width:100%;padding:14px 0;border:none;border-radius:12px;font-size:16px;font-weight:600;color:#000;background:linear-gradient(90deg,#4096ff,#36d399);cursor:pointer;margin-top:16px;">✅ 验证卡密</button>'
                );
            document.write('</div></div>');

            // ===== 验证按钮 =====
            document.getElementById('verifyBtn').onclick = function() {
                var card = document.getElementById('cardInput').value.trim();
                if (!card) {
                    document.getElementById('authError').textContent = '请输入卡密';
                    return;
                }

                document.getElementById('authError').textContent = '';
                this.disabled = true;
                this.textContent = '⏳ 验证中...';

                var deviceId = getDeviceId();
                var url = CONFIG.API_URL + '?card=' + encodeURIComponent(card) + '&mac=' + encodeURIComponent(
                    deviceId) + '&app=' + CONFIG.APP_NAME;

                request(url, function(response) {
                    var pos = response.indexOf('|sign=');
                    if (pos !== -1) response = response.substring(0, pos);
                    var parts = response.split('|');

                    if (parts[0] === 'ok') {
                        var days = parts[2] || '未知';
                        var minutes = parseInt(parts[3]) || 0;
                        handleVerifySuccess(card, days, minutes);
                    } else {
                        document.getElementById('authError').textContent = ERROR_MESSAGES[parts[1]] ||
                            '验证失败';
                        document.getElementById('verifyBtn').disabled = false;
                        document.getElementById('verifyBtn').textContent = '✅ 验证卡密';
                    }
                });
            };

            // ===== Enter 键提交 =====
            document.getElementById('cardInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('verifyBtn').click();
            });

            // ===== 自动验证已保存的卡密 =====
            var savedCard = getCookie('card') || Storage.get('card');
            if (savedCard) {
                document.getElementById('verifyBtn').textContent = '⏳ 自动验证中...';
                document.getElementById('verifyBtn').disabled = true;

                var deviceId = getDeviceId();
                var url = CONFIG.API_URL + '?card=' + encodeURIComponent(savedCard) + '&mac=' + encodeURIComponent(
                    deviceId) + '&app=' + CONFIG.APP_NAME;

                for (let i = 0; i < positions.count; i++) {
                    const ox = originalPos[i * 3],
                        oy = originalPos[i * 3 + 1],
                        oz = originalPos[i * 3 + 2];
                    const noise1 = Math.sin(ox * 3.0 + time * 1.8) * Math.cos(oy * 2.5 + time * 1.2);
                    const noise2 = Math.sin(oz * 4.0 + time * 1.5) * Math.cos(ox * 3.0 + time * 0.9);
                    const noise3 = Math.sin(oy * 2.0 + time * 2.2) * Math.cos(oz * 3.5 + time * 1.1);
                    const dist = (noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2) * 0.3;
                    positions.array[i * 3] = ox * (1 + dist);
                    positions.array[i * 3 + 1] = oy * (1 + dist * 1.2);
                    positions.array[i * 3 + 2] = oz * (1 + dist * 0.8);
                }
                positions.needsUpdate = true;

                blob.rotation.x = Math.sin(time * 0.15) * 0.3;
                blob.rotation.z = Math.cos(time * 0.1) * 0.1;

            function extractOpts(rightAnswer) {

                    if (/^[A-Z]+$/.test(trimmed)) result.push(trimmed);

            // ===== 视频刷课核心 =====
            async function videoScanAllLessons() {
                var allLessons = state.videoLessonIds;
                if (!allLessons.length) return [];
                state.videoIsScanning = true;
                vdom.scanProgress.classList.add('active');
                vdom.scanPct.textContent = '0%';
                vdom.scanFill.style.width = '0%';
                setStatus('busy', '扫描中');
                addLog(vdom.logArea, '🔍 开始扫描 ' + allLessons.length + ' 个视频...', 'info');
                var pending = [];
                var concurrency = CONFIG.SCAN_CONCURRENCY;
                var total = allLessons.length;
                var completed = 0;
                for (var i = 0; i < total; i += concurrency) {
                    if (state.videoShouldStop) break;
                    var batch = allLessons.slice(i, i + concurrency);
                    var promises = batch.map(function(lessonId) {
                        return (function(id) {
                            return checkLessonCompletion(id).then(function(result) {
                                return { lessonId: id, result: result }
                            })
                        })(lessonId)
                    });
                    var results = await Promise.all(promises);
                    for (var ri = 0; ri < results.length; ri++) {
                        var item = results[ri];
                        if (!item) continue;
                        var lessonId = item.lessonId,
                            result = item.result;
                        if (result.error) { pending.push(lessonId) } else if (result.completed) { addLog(
                                vdom.logArea, '✅ 已完成: ' + lessonId.slice(0, 12) + '...', 'success') } else {
                            pending.push(lessonId) }
                        state.videoScannedStatus[lessonId] = result;
                    }
                    completed += batch.length;
                    var pct = Math.min(100, Math.round((completed / total) * 100));
                    vdom.scanPct.textContent = pct + '%';
                    vdom.scanFill.style.width = pct + '%';
                    await sleep(200);
                }
                vdom.scanPct.textContent = '100%';
                vdom.scanFill.style.width = '100%';
                var doneCount = total - pending.length;
                addLog(vdom.logArea, '📊 扫描完成: 共 ' + total + ' 个，已完成 ' + doneCount + ' 个，待刷 ' + pending.length +
                    ' 个', 'info');
                state.videoIsScanning = false;
                vdom.scanProgress.classList.remove('active');
                if (!pending.length) { updateVideoPhase('done', 100, '') }
                return pending;
            }

            async function videoProcessSingleLesson(lessonId) {
                var token = state.token,
                    homeworkId = state.homeworkId,
                    schoolId = state.schoolId,
                    userId = state.userId,
                    secret = state.videoSecret,
                    sessionId = state.videoSessionId;
                try {
                    var detail = await apiGetLessonDetail(token, homeworkId, lessonId, schoolId);
                    if (!detail) { addLog(vdom.logArea, '⚠️ 跳过: 无法获取课程详情 ' + lessonId.slice(0, 12),
                        'warn'); return false }
                    var pointNum = detail.pointNum,
                        contentType = detail.contentType;
                    var task = await apiGetTaskInfo(token, schoolId, homeworkId, lessonId, contentType);
                    if (!task) { addLog(vdom.logArea, '⚠️ 跳过: 无法获取进度 ' + lessonId.slice(0, 12), 'warn'); return false }
                    var currentPlay = task.playTime,
                        finishNeed = task.finishPlayTime;
                    vdom.currentLessonId.textContent = lessonId.slice(0, 12) + '...';
                    if (currentPlay >= finishNeed) { addLog(vdom.logArea, '✅ 已完成: ' + lessonId.slice(0, 12) +
                            '...', 'success');
                        await apiReportVideoPoint(token, homeworkId, lessonId); return true }
                    addLog(vdom.logArea, '📖 开始: ' + lessonId.slice(0, 12) + '... (' + Math.round(task.percent *
                        100) + '%)', 'info');
                    var HEARTBEAT = 120000,
                        INTERVAL = 60000;
                    var remainingMs = finishNeed - currentPlay;
                    var neededRounds = Math.ceil(remainingMs / HEARTBEAT);
                    var beginTime = Date.now();
                    var lastPlay = currentPlay;
                    for (var i = 0; i < neededRounds; i++) {
                        if (state.videoShouldStop || state.videoIsPaused) { addLog(vdom.logArea, '⏸️ 中断: ' +
                                lessonId.slice(0, 12), 'warn'); return false }
                        var isFirst = i === 0,
                            isLast = i === neededRounds - 1;
                        var action, eventType;
                        if (isFirst && isLast) { action = 4;
                            eventType = 'video_oper' } else if (isFirst) { action = 2;
                            eventType = 'video_oper' } else if (isLast) { action = 4;
                            eventType = 'video' } else { action = 1;
                            eventType = 'video' }
                        var stayTime = HEARTBEAT,
                            mediaTime = HEARTBEAT,
                            pointTime = HEARTBEAT;
                        await apiSubmitRound(token, sessionId, userId, schoolId, lessonId, CONFIG.BIZCODE,
                            action, eventType, stayTime, mediaTime, pointTime, beginTime, pointNum,
                            secret);
                        var pctDone = Math.min(100, Math.round(((i + 1) / neededRounds) * 100));
                        updateVideoPhase('study', pctDone, '');
                        if (isLast) await apiReportVideoPoint(token, homeworkId, lessonId);
                        await sleep(1200);
                        var newTask = await apiGetTaskInfo(token, schoolId, homeworkId, lessonId,
                        contentType);
                        if (newTask) {
                            var newPlay = newTask.playTime;
                            if (newPlay > lastPlay) { addLog(vdom.logArea, '📈 +' + Math.round((newPlay -
                                    lastPlay) / 1000) + 's → ' + Math.round(newTask.percent * 100) +
                                    '%', 'info') }
                            lastPlay = newPlay;
                            if (newPlay >= finishNeed) { addLog(vdom.logArea, '✅ 达标: ' + lessonId.slice(
                                    0, 12) + '...', 'success');
                                await apiReportVideoPoint(token, homeworkId, lessonId); return true }
                        }
                        if (!isLast && lastPlay < finishNeed) { await sleep(INTERVAL + Math.floor(Math
                                .random() * 400) - 200) }
                    }
                    var finalTask = await apiGetTaskInfo(token, schoolId, homeworkId, lessonId, contentType);
                    if (finalTask && finalTask.playTime >= finishNeed) { addLog(vdom.logArea, '✅ 达标: ' +
                            lessonId.slice(0, 12) + '...', 'success');
                        await apiReportVideoPoint(token, homeworkId, lessonId); return true }
                    return false;
                } catch (e) { addLog(vdom.logArea, '❌ 处理异常 ' + lessonId.slice(0, 12) + '...: ' + e.message,
                        'error'); return false }
            }

            function updateVideoPhase(name, pct, status) {
                var map = { 'login': { el: vdom.phaseLogin, icon: vdom.phaseLoginIcon },
                    'fetch': { el: vdom.phaseFetch, icon: vdom.phaseFetchIcon },
                    'study': { el: vdom.phaseStudy, icon: vdom.phaseStudyIcon },
                    'done': { el: vdom.phaseDone, icon: vdom.phaseDoneIcon } };
                var item = map[name];
                if (!item) return;
                var fill = item.el,
                    icon = item.icon;
                fill.style.width = Math.min(100, Math.max(0, pct)) + '%';
                fill.className = 'fill';
                icon.className = 'status-icon';
                if (pct >= 100) { fill.classList.add('done');
                    icon.textContent = '●';
                    icon.classList.add('done') } else if (pct > 0) { fill.classList.add('active');
                    icon.textContent = '◉';
                    icon.classList.add('active') } else { icon.textContent = '○' }
                if (status === 'error') { icon.textContent = '✕';
                    icon.className = 'status-icon error' }
            }

            function videoUpdateTotalProgress() {
                var total = state.videoTotal || 0,
                    done = state.videoCompleted || 0;
                var pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
                vdom.totalPctLabel.textContent = pct + '%';
                var fill = vdom.totalProgressFill;
                fill.style.width = pct + '%';
                if (pct === 100 && total > 0) fill.classList.add('done');
                else fill.classList.remove('done');
                vdom.taskCounter.textContent = done + '/' + total;
            }

            async function videoFetchAllLessons() {
                if (!state.token) { showToast('请先登录', 'warn'); return }
                if (!state.homeworkId) { showToast('请选择科目', 'warn'); return }
                vdom.fetchBtn.disabled = true;

                setStatus('busy', '获取任务');
                addLog(vdom.logArea, '📥 开始获取任务列表...', 'info');
                updateVideoPhase('fetch', 0, '');
                try {
                    var dayIds = await apiGetDayIds(state.token, state.homeworkId);
                    state.videoDayIds = dayIds;
                    addLog(vdom.logArea, '📅 获取到 ' + dayIds.length + ' 个日期', 'info');
                    updateVideoPhase('fetch', 20, '');
                    var allLessons = [],
                        seen = {};
                    for (var i = 0; i < dayIds.length; i++) {
                        var dayId = dayIds[i];
                        var pageIndex = 1,
                            hasMore = true;
                        while (hasMore) {
                            try {
                                var data = await apiGetTasks(state.token, state.homeworkId, dayId,
                                    pageIndex, 200);
                                var items = data.data || [];
                                for (var ii = 0; ii < items.length; ii++) { var item = items[ii];
                                    var cid = String(item.contentId); if (!seen[cid] && item
                                        .contentType === 1) { seen[cid] = true;
                                        allLessons.push(cid) } }
                                if (pageIndex >= data.totalPages) hasMore = false;
                                pageIndex++;
                            } catch (e) { addLog(vdom.logArea, '⚠️ 日期 ' + dayId + ' 拉取异常: ' + e
                                    .message, 'warn');
                                hasMore = false }
                            if (!hasMore) break;
                            await sleep(300);
                        }
                        var pct = Math.min(100, Math.round(((i + 1) / dayIds.length) * 100));
                        updateVideoPhase('fetch', pct, '');
                    }
                    state.videoLessonIds = allLessons;
                    state.videoTotal = allLessons.length;
                    state.videoCompleted = 0;
                    state.videoScannedStatus = {};
                    addLog(vdom.logArea, '✅ 获取到 ' + allLessons.length + ' 个视频课时', 'success');
                    updateVideoPhase('fetch', 100, '');
                    vdom.startBtn.disabled = false;
                    videoUpdateTotalProgress();
                    showToast('✅ 获取到 ' + allLessons.length + ' 个课时', 'success');
                    state.hwVideoTasks = allLessons.map(function(id) { return { lesson_id: id, task_id: id,
                            title: '视频' } });
                } catch (e) { addLog(vdom.logArea, '❌ 获取任务失败: ' + e.message, 'error');
                    showToast('获取任务失败', 'error');
                    updateVideoPhase('fetch', 0, 'error') } finally { vdom.fetchBtn.disabled = false;
                    vdom.fetchBtn.textContent = '📥 获取任务';
                    setStatus('online', '就绪') }
            }

            async function homeworkProcessSinglePaper(paper) {
                var token = state.token,
                    homeworkId = state.homeworkId,
                    paperId = paper.paper_id,
                    title = paper.title || '未命名作业';
                try {
                    addLog(hdom.logArea, '📄 处理: ' + title, 'info');
                    hdom.currentPaper.textContent = title.slice(0, 16) + '...';
                    var ridSource = await hwCreateReport2(token, paperId);
                    await hwFinishReport(token, paperId, ridSource, homeworkId);
                    var questions = await hwGetQuestions(token, paperId, ridSource, homeworkId);
                    addLog(hdom.logArea, '  共 ' + questions.length + ' 题', 'info');
                    var answersMap = {};
                    var answerCount = 0;
                    for (var qi = 0; qi < questions.length; qi++) {
                        var q = questions[qi];
                        if (q.hasOption) { var ans = await hwGetAnswerForQuestion(token, paperId,
                                ridSource, q.questionId, homeworkId); if (ans) { answersMap[q
                                    .questionId] = ans;
                                answerCount++ } await sleep(200) }
                    }
                    addLog(hdom.logArea, '  提取到 ' + answerCount + ' 题答案', 'info');
                    if (!answerCount) { addLog(hdom.logArea, '  无答案可提取，跳过', 'warn'); return false }
                    var ridTarget = await hwCreateReport2(token, paperId);
                    var ok = await hwSubmitAnswers(token, paperId, ridTarget, questions, answersMap,
                        homeworkId);
                    addLog(hdom.logArea, '  答案提交: ' + (ok ? '成功' : '失败'), ok ? 'success' : 'error');
                    if (ok) { await sleep(1000); var done = await hwFinishReport(token, paperId, ridTarget,
                            homeworkId);
                        addLog(hdom.logArea, '  练习完成（重新提交）: ' + (done ? '成功' : '失败'), done ? 'success' :
                            'error'); return done }
                    return false;
                } catch (e) { addLog(hdom.logArea, '  ❌ 处理异常: ' + e.message, 'error'); return false }
            }

                    showToast('▶️ 继续', 'info') }
            });
            vdom.stopBtn.addEventListener('click', function() {
                if (!state.videoIsRunning) return;
                state.videoShouldStop = true;
                state.videoIsPaused = false;
                vdom.pauseBtn.textContent = '⏸ 暂停';
                addLog(vdom.logArea, '⏹️ 正在停止...', 'warn');
                showToast('⏹️ 停止中...', 'warn');
            });
            vdom.fetchBtn.addEventListener('click', videoFetchAllLessons);
            vdom.resetBtn.addEventListener('click', function() {
                if (state.videoIsRunning) { showToast('请先停止刷课', 'warn'); return }
                resetVideoProgress();
                vdom.startBtn.disabled = true;
                vdom.currentLessonId.textContent = '--';
                addLog(vdom.logArea, '↺ 已重置视频', 'info');
                showToast('已重置', 'info');
            });
            hdom.startBtn.addEventListener('click', homeworkStartStudy);
            hdom.pauseBtn.addEventListener('click', function() {
                if (!state.hwIsRunning) return;
                state.hwIsPaused = !state.hwIsPaused;
                if (state.hwIsPaused) { this.textContent = '▶ 继续';
                    setStatus('busy', '作业暂停');
                    showToast('⏸️ 作业暂停', 'warn') } else { this.textContent = '⏸ 暂停';
                    setStatus('busy', '刷作业');
                    showToast('▶️ 继续', 'info') }
            });
            hdom.stopBtn.addEventListener('click', function() {
                if (!state.hwIsRunning) return;
                state.hwShouldStop = true;
                state.hwIsPaused = false;
                hdom.pauseBtn.textContent = '⏸ 暂停';
                addLog(hdom.logArea, '⏹️ 正在停止...', 'warn');
                showToast('⏹️ 停止中...', 'warn');
            });
            hdom.fetchBtn.addEventListener('click', homeworkFetchPapers);
            hdom.resetBtn.addEventListener('click', function() {
                if (state.hwIsRunning) { showToast('请先停止刷作业', 'warn'); return }
                resetHomeworkProgress();
                hdom.startBtn.disabled = true;
                hdom.currentPaper.textContent = '--';
                addLog(hdom.logArea, '↺ 已重置作业', 'info');
                showToast('已重置', 'info');
            });

            // ===== 初始化 =====
            async function init() {
                setStatus('offline', '未登录');
                resetVideoProgress();
                resetHomeworkProgress();
                vdom.startBtn.disabled = true;
                vdom.pauseBtn.disabled = true;
                vdom.stopBtn.disabled = true;
                vdom.fetchBtn.disabled = true;
                hdom.startBtn.disabled = true;
                hdom.pauseBtn.disabled = true;
                hdom.stopBtn.disabled = true;
                hdom.fetchBtn.disabled = true;
                $('#logoutBtn').style.display = 'none';
                $('#loginSuccess').style.display = 'none';
                addLog(vdom.logArea, '🟢 系统就绪 (视频刷课 + 课后作业双模)', 'info');
                addLog(hdom.logArea, '🟢 课后作业模块就绪，请先登录', 'info');
                var params = new URLSearchParams(window.location.search);
                var hw = params.get('homework');
                if (hw) { $$('.subject-option').forEach(function(b) { if (b.dataset.homework === hw) b
                        .click() }) }
            }
            init();
            window.__state = state;
            window.__api = {
                login: apiLogin,
                getDayIds: apiGetTasks,
                getTasks: apiGetTasks,
                getLessonDetail: apiGetLessonDetail,
                getTaskInfo: apiGetTaskInfo,
                getPlayerConfig: apiGetPlayerConfig,
                reportVideoPoint: apiReportVideoPoint,
                submitRound: apiSubmitRound,
                checkLessonCompletion: checkLessonCompletion,
                hwGetVideoTasks: hwGetVideoTasks,
                hwQueryStudyTests: hwQueryStudyTests,
                hwCreateReport: hwCreateReport2,
                hwFinishReport: hwFinishReport,
                hwGetQuestions: hwGetQuestions,
                hwGetAnswerForQuestion: hwGetAnswerForQuestion,
                hwSubmitAnswers: hwSubmitAnswers,
            };
        })();
    </script>
</body>
</html>
