<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>像素动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0a0a12;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }
        #wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            width: 92vw;
            height: 92vw;
            max-width: 92vh;
            max-height: 92vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 3px;
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.06);
        }
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(139, 92, 246, 0.012) 3px,
                rgba(139, 92, 246, 0.012) 6px
            );
        }
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 11;
            background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.5) 100%);
        }
        .controls {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 14px; z-index: 20;
            background: rgba(20, 18, 32, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(139, 92, 246, 0.1);
            border-radius: 28px;
            padding: 10px 22px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        body:hover .controls, body:active .controls { opacity: 1; }
        .ctrl-btn {
            background: none; border: none; color: rgba(196, 181, 253, 0.55);
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: color 0.2s; font-family: inherit; padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:hover { color: #c4b5fd; }
        .ctrl-btn:active { opacity: 0.6; }
        .ctrl-sep {
            width: 1px; height: 14px; background: rgba(139, 92, 246, 0.18);
        }
        .ctrl-info {
            font-size: 12px; color: rgba(196, 181, 253, 0.3);
            font-variant-numeric: tabular-nums;
        }
        .pixel-badge {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: rgba(196, 181, 253, 0.2);
            letter-spacing: 4px; text-transform: uppercase; z-index: 20;
            pointer-events: none;
        }
        @media (min-width: 600px) {
            #canvas { width: 480px; height: 480px; }
        }
    </style>
</head>
<body>
    <div class="pixel-badge">这野人魔了</div>
    <div id="wrap">
        <canvas id="canvas" width="128" height="128"></canvas>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="controls">
        <button class="ctrl-btn" id="btnPause">⏸ 暂停</button>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" id="btnSpeed">⚡ 1.0x</button>
        <div class="ctrl-sep"></div>
        <span class="ctrl-info" id="frameInfo">1 / 20</span>
    </div>

        ];

        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        var frameImages = [];
        var loaded = 0;
        var total = FRAMES.length;
        var current = 0;
        var isPaused = false;
        var speed = 1.0;
        var lastTime = 0;
        var frameDelay = 100;
        var animId;

        FRAMES.forEach(function(b64, i) {
            var img = new Image();
            img.onload = function() {
                loaded++;
                frameImages[i] = img;
                if (loaded === total) requestAnimationFrame(loop);
            };
            img.src = 'data:image/png;base64,' + b64;
        });

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            var elapsed = timestamp - lastTime;
            var delay = frameDelay / speed;

            if (elapsed >= delay && !isPaused) {
                lastTime = timestamp;
                ctx.clearRect(0, 0, 128, 128);
                ctx.drawImage(frameImages[current], 0, 0, 128, 128);
                current = (current + 1) % total;
                document.getElementById('frameInfo').textContent = (current + 1) + ' / ' + total;
            }
            animId = requestAnimationFrame(loop);
        }

        document.getElementById('btnPause').addEventListener('click', function() {
            isPaused = !isPaused;
            this.textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
        });

        document.getElementById('btnSpeed').addEventListener('click', function() {
            var speeds = [0.5, 1.0, 2.0, 4.0];
            var idx = speeds.indexOf(speed);
            speed = speeds[(idx + 1) % speeds.length];
            this.textContent = '⚡ ' + speed.toFixed(1) + 'x';
        });
    })();
    </script>
